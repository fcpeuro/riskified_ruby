name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  specs:
    name: Specs (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "2.1"
            bundler: "1.17.3"
          - ruby: "2.7"
            bundler: "2.3.27"
          - ruby: "3.4"
            bundler: "2.6.9"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install Bundler
        run: gem install bundler --no-document --version "${{ matrix.bundler }}"
      - name: Install dependencies
        run: |
          if [ "${{ matrix.ruby }}" = "2.1" ]; then
            bundle _${{ matrix.bundler }}_ update --all
          else
            bundle _${{ matrix.bundler }}_ install
          fi
      - name: Run specs
        run: bundle _${{ matrix.bundler }}_ exec rspec
